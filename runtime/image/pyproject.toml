[project]
name = "kilix-bonsai-image-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.6.0+cu124",
  "triton==3.2.0",
  "gemlite==0.4.7",
  "hqq==0.2.8.post1",
  "diffusers==0.38.0",
  "transformers==5.8.1",
  "accelerate==1.13.0",
  "setuptools==80.10.2",
  "pillow==12.3.0",
  "prism-image-studio-backend-gpu",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
prism-image-studio-backend-gpu = { git = "https://github.com/PrismML-Eng/image-studio.git", rev = "31b02171634c16b5da0eec6aea075e7489d5fb39", subdirectory = "backend_gpu" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
